[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbd-nigeria-west-africa"
version = "0.2.0"
description = "Reproducible GBD analysis framework for Nigeria and West Africa"
authors = [{name = "Ekemini Thompson"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "statsmodels>=0.14,<1", "scipy>=1.11,<2", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
